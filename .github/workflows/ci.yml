name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real PostgreSQL + pgvector database for the tests, same image as docker-compose.yml
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docguard
          POSTGRES_PASSWORD: docguard
          POSTGRES_DB: docguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
